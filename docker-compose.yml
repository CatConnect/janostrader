---
services:

  hub:
    build:
      context: ./hub
      dockerfile: Dockerfile
    image: janostrader-hub:latest
    container_name: janostrader-hub
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ACCESS_KEY=${ACCESS_KEY}
      - INTERNAL_KEY=${INTERNAL_KEY}
      - STRATEGIES_VOLUME_PATH=/strategies
      - STRATEGIES_SEED_PATH=/app/strategies
    volumes:
      - strategies_vol:/strategies
      - ./strategies:/app/strategies:ro
    ports:
      - "8080:3000"   # dashboard do hub em :8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/internal/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  freqtrade:
    build:
      context: ./freqtrade
      dockerfile: Dockerfile
    image: janostrader-bot:latest
    container_name: freqtrade-supertrend
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_healthy
    environment:
      - HUB_URL=http://hub:3000
      - BOT_NAME=supertrend
      - INTERNAL_KEY=${INTERNAL_KEY}
    volumes:
      - strategies_vol:/freqtrade/user_data/strategies:ro
      - freqtrade_logs:/freqtrade/user_data/logs
      - freqtrade_data:/freqtrade/user_data/data
      - freqtrade_cache:/freqtrade/user_data
    # sem porta externa — hub é o ponto de acesso
    command:
      - trade
      - --logfile
      - /freqtrade/user_data/logs/freqtrade.log
      - --config
      - /freqtrade/config.json
      - --strategy
      - FSupertrendStrategy
      - --strategy-path
      - /freqtrade/user_data/strategies

  freqtrade-dualmacd:
    build:
      context: ./freqtrade
      dockerfile: Dockerfile
    image: janostrader-bot:latest
    container_name: freqtrade-dualmacd
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_healthy
    environment:
      - HUB_URL=http://hub:3000
      - BOT_NAME=dualmacd
      - INTERNAL_KEY=${INTERNAL_KEY}
    volumes:
      - strategies_vol:/freqtrade/user_data/strategies:ro
      - dualmacd_logs:/freqtrade/user_data/logs
      - dualmacd_data:/freqtrade/user_data/data
      - dualmacd_cache:/freqtrade/user_data
    command:
      - trade
      - --logfile
      - /freqtrade/user_data/logs/freqtrade.log
      - --config
      - /freqtrade/config.json
      - --strategy
      - FDualMacdStrategy
      - --strategy-path
      - /freqtrade/user_data/strategies

volumes:
  strategies_vol:
  freqtrade_logs:
  freqtrade_data:
  freqtrade_cache:
  dualmacd_logs:
  dualmacd_data:
  dualmacd_cache:
